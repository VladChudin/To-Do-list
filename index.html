<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>To-Do List</title>
    <link
      rel="stylesheet"
      href="src/styles/main.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <h1>To-Do List</h1>
      <form class ="task-form">
        <input
          type ="text"
          class ="task-input"
          placeholder="Enter a new task"
          required
        />
        <button class="btn" type="submit">Add Task</button>
      </form>
      <div class="status">
        <p class="all-tasks">Count of tasks: 0</p>
        <p class="active-tasks">Active tasks: 0</p>
        <p class="completed-tasks">Completed tasks: 0</p>
      </div>
      <div class="sort">
        <h2>Tasks</h2>
        <button class="sort-btn">
          <img src="icons/sort.svg" alt="sort">
        </button>

      </div>
      <ul class="task-list">
      </ul>
      <div class="filters">
        <button data-filter="all">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
    </div>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
